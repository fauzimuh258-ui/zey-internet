<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeyChat V2 - P2P Messaging</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, sans-serif; 
            background: #0a0a0f; 
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #header { 
            background: #1a1a2e; 
            padding: 15px; 
            border-bottom: 2px solid #00ff88;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #status { 
            width: 10px; height: 10px; 
            background: #00ff88; 
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
        #messages { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px;
        }
        .msg { 
            margin: 10px 0; 
            padding: 12px;
            background: #1a1a2e;
            border-radius: 12px;
            border-left: 3px solid #00ff88;
            max-width: 80%;
            animation: slideIn 0.3s;
        }
        @keyframes slideIn { from{opacity:0;transform:translateX(-20px)} to{opacity:1;transform:translateX(0)} }
        .msg .from { 
            color: #00ff88; 
            font-size: 0.8em; 
            margin-bottom: 5px;
        }
        .msg .time { 
            color: #666; 
            font-size: 0.7em; 
            margin-top: 5px;
        }
        #input { 
            padding: 15px; 
            background: #1a1a2e;
            display: flex;
            gap: 10px;
        }
        input[type=text] { 
            flex: 1;
            background: #0a0a0f;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            border-radius: 25px;
            outline: none;
        }
        input[type=text]:focus { border-color: #00ff88; }
        button { 
            background: #00ff88; 
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { transform: scale(0.95); }
        .peer-info {
            font-size: 0.8em;
            color: #888;
        }
    </style>
</head>
<body>
    <div id="header">
        <div>
            <h2>💬 ZeyChat V2</h2>
            <div class="peer-info" id="peerInfo">Connecting...</div>
        </div>
        <div id="status"></div>
    </div>
    
    <div id="messages"></div>
    
    <div id="input">
        <input type="text" id="msgInput" placeholder="Type message..." autofocus>
        <button onclick="send()">Send</button>
    </div>

    <script>
        const API = '';
        let lastTimestamp = 0;
        
        // Load status
        async function loadStatus() {
            const res = await fetch('/api/status');
            const data = await res.json();
            document.getElementById('peerInfo').textContent = 
                `Node: ${data.nodeId} | Peers: ${data.peers}`;
        }
        
        // Send message
        async function send() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;
            
            await fetch('/api/chat/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: text, to: 'broadcast' })
            });
            
            addMsg('You', text, Date.now());
            input.value = '';
        }
        
        // Add message to UI
        function addMsg(from, text, timestamp) {
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `
                <div class="from">${from}</div>
                <div>${text}</div>
                <div class="time">${new Date(timestamp).toLocaleTimeString()}</div>
            `;
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = 999999;
        }
        
        // Poll for new messages
        async function poll() {
            try {
                const res = await fetch(`/api/chat/receive?since=${lastTimestamp}`);
                const data = await res.json();
                
                data.messages.forEach(msg => {
                    if (msg.from !== 'You') {
                        addMsg(msg.from, msg.content, msg.timestamp);
                        lastTimestamp = Math.max(lastTimestamp, msg.timestamp);
                    }
                });
            } catch(e) {}
            
            setTimeout(poll, 1000);
        }
        
        // Enter key
        document.getElementById('msgInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') send();
        });
        
        // Init
        loadStatus();
        poll();
        setInterval(loadStatus, 5000);
    </script>
</body>
</html>
