<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeyBrowser V2 - P2P Web</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
        }
        .navbar {
            background: #1a1a2e;
            padding: 15px;
            display: flex;
            gap: 10px;
            position: sticky;
            top: 0;
        }
        .navbar input {
            flex: 1;
            background: #0a0a0f;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            border-radius: 25px;
            outline: none;
        }
        .navbar button {
            background: #0088ff;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            margin: 15px 0;
        }
        iframe {
            width: 100%;
            height: 60vh;
            border: none;
            border-radius: 8px;
            background: #fff;
        }
        .cache-badge {
            display: inline-block;
            background: #00ff88;
            color: #000;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-left: 10px;
        }
        .cache-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .cache-item {
            padding: 12px;
            background: #0a0a0f;
            margin: 8px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cache-item .url {
            color: #0088ff;
            text-decoration: none;
            flex: 1;
            margin-right: 10px;
        }
        .cache-item .size {
            color: #888;
            font-size: 0.9em;
        }
        .btn-small {
            padding: 6px 12px;
            font-size: 0.9em;
            margin-left: 10px;
        }
        .btn-clear {
            background: #ff4444;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <input type="text" id="url" placeholder="Enter URL or search..." 
               onkeypress="if(event.key==='Enter') browse()">
        <button onclick="browse()">Go</button>
        <button onclick="toggleCache()" style="background:#666">📦</button>
    </div>

    <div class="container">
        <div id="browser-view" class="card">
            <h3>🌐 ZeyBrowser V2 <span id="cacheStatus"></span></h3>
            <p style="color:#888;margin:10px 0">Enter a URL above to browse via P2P network</p>
            <iframe id="frame" sandbox="allow-same-origin allow-scripts"></iframe>
        </div>

        <div id="cache-view" class="card" style="display:none">
            <h3>📦 P2P Web Cache</h3>
            <p style="color:#888;margin:10px 0">These pages are cached and available offline via P2P</p>
            <div class="cache-list" id="cacheList"></div>
            <button onclick="clearCache()" class="btn-clear" style="margin-top:15px">Clear Cache</button>
        </div>
    </div>

    <script>
        let cacheVisible = false;
        
        async function browse() {
            const url = document.getElementById('url').value;
            if (!url) return;
            
            const fullUrl = url.startsWith('http') ? url : `https://${url}`;
            
            // Show loading
            document.getElementById('cacheStatus').innerHTML = '<span style="color:#ffaa00">Loading...</span>';
            
            try {
                const res = await fetch(`/api/web/browse?url=${encodeURIComponent(fullUrl)}`);
                
                if (res.status === 200) {
                    const html = await res.text();
                    const blob = new Blob([html], {type: 'text/html'});
                    document.getElementById('frame').src = URL.createObjectURL(blob);
                    
                    const cache = res.headers.get('X-Cache');
                    document.getElementById('cacheStatus').innerHTML = 
                        cache === 'HIT' ? '<span class="cache-badge">⚡ P2P Cache</span>' : 
                                         '<span class="cache-badge" style="background:#ffaa00">🌐 Fetched</span>';
                } else {
                    alert('Failed to load page');
                }
            } catch(e) {
                alert('Error: ' + e.message);
            }
        }
        
        function toggleCache() {
            cacheVisible = !cacheVisible;
            document.getElementById('browser-view').style.display = cacheVisible ? 'none' : 'block';
            document.getElementById('cache-view').style.display = cacheVisible ? 'block' : 'none';
            if (cacheVisible) loadCache();
        }
        
        async function loadCache() {
            const res = await fetch('/api/web/cache');
            const data = await res.json();
            
            const list = document.getElementById('cacheList');
            if (data.cached && data.cached.length > 0) {
                list.innerHTML = data.cached.map(item => `
                    <div class="cache-item">
                        <a href="#" class="url" onclick="loadCached('${item.url}')">${item.url}</a>
                        <span class="size">${(item.size/1024).toFixed(1)}KB</span>
                    </div>
                `).join('');
            } else {
                list.innerHTML = '<p style="color:#888">No cached pages</p>';
            }
        }
        
        async function loadCached(url) {
            document.getElementById('url').value = url;
            browse();
        }
        
        async function clearCache() {
            if (!confirm('Clear all cached pages?')) return;
            // Implementation would need DELETE endpoint
            alert('Cache cleared (implement DELETE /api/web/cache)');
        }
    </script>
</body>
</html>
